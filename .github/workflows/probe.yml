# TEMPORARY: inspect the NYC DOF exemption dataset. Removed after use.
name: Probe
on:
  push:
    branches: [claude/code-review-testing-q7elwy]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://data.cityofnewyork.us
          echo "== description"; curl -s "$B/api/views/muvi-b6kx.json" | jq -r '.description, (.metadata.attachments // [] | .[] | [.name, .filename, .assetId, .blobId] | @tsv)'
          echo "== low codes by year (residential-looking)"; curl -s -G "$B/resource/muvi-b6kx.json" --data-urlencode '$select=year,period,exmp_code,nys_exmp_code,count(*)' --data-urlencode "\$where=year in ('2026','2027') AND exmp_code < '2000'" --data-urlencode '$group=year,period,exmp_code,nys_exmp_code' --data-urlencode '$order=count(*) DESC' --data-urlencode '$limit=40' | jq -r '.[] | [.year,.period,.exmp_code,.nys_exmp_code,.count] | @tsv'
          for c in 1010 1015 1017 1019 1021 1101 1200 1301 1501; do echo "== bldg classes for $c (all years)"; curl -s -G "$B/resource/muvi-b6kx.json" --data-urlencode '$select=bldg_class,boro,count(*)' --data-urlencode "\$where=exmp_code='$c'" --data-urlencode '$group=bldg_class,boro' --data-urlencode '$order=count(*) DESC' --data-urlencode '$limit=6' | jq -r '[.[] | "\(.bldg_class)/\(.boro):\(.count)"] | join(" ")'; curl -s -G "$B/resource/muvi-b6kx.json" --data-urlencode '$select=year,count(*)' --data-urlencode "\$where=exmp_code='$c'" --data-urlencode '$group=year' --data-urlencode '$order=year DESC' --data-urlencode '$limit=5' | jq -r '[.[] | "\(.year):\(.count)"] | join(" ")'; done
