# TEMPORARY: reproduce the address-search miss against the real locator. Removed after use.
name: Probe
on:
  push:
    branches: [claude/code-review-testing-q7elwy]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          L=https://gisservices.its.ny.gov/arcgis/rest/services/Locators/Street_and_Address_Composite/GeocodeServer/findAddressCandidates
          q() { echo "-- [$2] $1"; curl -s -G "$L" --data-urlencode "SingleLine=$1" --data-urlencode "outSR=4326" --data-urlencode "maxLocations=5" --data-urlencode "outFields=Score" --data-urlencode "f=json" ${3:+--data-urlencode "searchExtent=$3"} | jq -c '[.candidates[]? | {a: .address, s: .score}] , .error'; }
          for s in "33 Court St, Valley Stream, NY 11580, United States" "33 Court St, Valley Stream, NY 11580, USA" "33 Court St, Valley Stream, NY 11580" "33 Court St Valley Stream" "47-14 11 St, NY"; do
            q "$s" "no extent"
            q "$s" "app extent (plain)" "-74.3,40.45,-71.8,41.2"
            q "$s" "extent json 4326" '{"xmin":-74.3,"ymin":40.45,"xmax":-71.8,"ymax":41.2,"spatialReference":{"wkid":4326}}'
          done
