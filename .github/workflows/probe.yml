# TEMPORARY: checks the HMDA data format from GitHub's network. Removed after use.
name: Probe
on:
  push:
    branches: [claude/code-review-testing-q7elwy]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: HMDA query
        run: |
          curl -sSL --compressed -o n.csv "https://ffiec.cfpb.gov/v2/data-browser-api/view/csv?years=2024&counties=36059&actions_taken=1,2,3&loan_purposes=1,31,32" -w "HTTP %{http_code}\n"
          head -1 n.csv | tr ',' '\n' | nl | head -110
          sed -n 2,2p n.csv
          wc -l n.csv
          curl -sSL --compressed -o y.csv "https://ffiec.cfpb.gov/v2/data-browser-api/view/csv?years=2025&counties=36059&actions_taken=1,2,3&loan_purposes=1,31,32" -w "2025: HTTP %{http_code}\n"; head -c 200 y.csv; echo
      - name: column stats
        run: |
          python3 - <<'PY'
          import csv, collections
          r = csv.DictReader(open('n.csv'))
          C = {k: collections.Counter() for k in ['action_taken','loan_purpose','occupancy_type','derived_dwelling_category','total_units','denial_reason-1','denial_reason-2','denial_reason-3','lien_status','business_or_commercial_purpose','reverse_mortgage']}
          tr = collections.Counter()
          for row in r:
              for k in C: C[k][row.get(k)] += 1
              tr[row.get('census_tract')] += 1
          for k, v in C.items(): print(k, v.most_common(12))
          print('tracts', len(tr), tr.most_common(3), 'median apps', sorted(tr.values())[len(tr)//2] if tr else None)
          PY
      - name: Other county sizes
        run: |
          for c in 36047 36081 36103; do
            curl -sS --compressed -L -o x.csv "https://ffiec.cfpb.gov/v2/data-browser-api/view/csv?years=2024&counties=$c&actions_taken=1,2,3&loan_purposes=1,31,32" -w "$c HTTP %{http_code} size %{size_download} time %{time_total}\n"; wc -l x.csv
          done
      - name: Census B25081 / B25077 labels
        run: |
          curl -sS https://api.census.gov/data/2024/acs/acs5/groups/B25081.json | python3 -c "import json,sys; d=json.load(sys.stdin)['variables']; [print(k, v['label']) for k, v in sorted(d.items()) if k.endswith('E')]"
          curl -sS https://api.census.gov/data/2024/acs/acs5/groups/B25077.json | python3 -c "import json,sys; d=json.load(sys.stdin)['variables']; [print(k, v['label']) for k, v in sorted(d.items()) if k.endswith('E')]"
