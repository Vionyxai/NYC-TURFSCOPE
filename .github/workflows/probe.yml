# TEMPORARY: find the Nassau BOE FOIL contact. Removed after use.
name: Probe
on:
  push:
    branches: [claude/code-review-testing-q7elwy]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          A="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          curl -sL -A "$A" "https://www.nassaucountyny.gov/573/FOIL-Requests" -o f.htm -w "%{http_code}\n"
          python3 - <<'PY'
          import re,html
          t=open('f.htm',encoding='utf-8',errors='ignore').read()
          m=re.search(r'<div[^>]*id="page"[^>]*>(.*)', t, re.S) or re.search(r'<main.*', t, re.S)
          body=m.group(0) if m else t
          for a in re.findall(r'href="([^"]*)"[^>]*>([^<]*)', body):
              if re.search(r'foil|form|mailto|pdf|apex|request', a[0]+a[1], re.I): print('LINK', a)
          txt=html.unescape(re.sub(r'<[^>]+>',' ',body)); txt=re.sub(r'\s+',' ',txt)
          i=txt.find('FOIL'); print(txt[max(0,i-200):i+2500])
          PY
