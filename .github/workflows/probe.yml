# TEMPORARY: look for official 2024 results by election district. Removed after use.
name: Probe
on:
  push:
    branches: [claude/code-review-testing-q7elwy]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          U='https://vote.nyc/sites/default/files/pdf/election_results/2024/20241105General%20Election/00000100000Citywide%20President%20Vice%20President%20Citywide%20EDLevel.csv'
          curl -sL -A "Mozilla/5.0" -o ed.csv "$U"
          echo "== party / unit combos"
          python3 - <<'PY'
          import csv,collections
          c=collections.Counter(); t=collections.Counter(); st=collections.Counter(); n=0
          for r in csv.reader(open('ed.csv')):
              v=r[11:] if len(r)>=22 else r
              if v[0]=='AD': continue
              n+=1; c[(v[5],v[9])]+=1; t[(v[5],v[9])]+=int(v[10] or 0); st[v[3]]+=1
          print('rows',n)
          for k in sorted(c): print(k,c[k],t[k])
          print(st.most_common(8))
          PY
          echo "== one ED all rows"; grep '"23","001"' ed.csv | head -20 | cut -c1-400
          echo "== Suffolk results page"; curl -sL -A "Mozilla/5.0" "https://www.suffolkvotes.com/Departments/BOE/Election-Results" | grep -io 'href="[^"]*\(2024\|result\|xls\|csv\)[^"]*"' | sort -u | head -20
          echo "== Nassau"; curl -sL -A "Mozilla/5.0" "https://www.nassaucountyny.gov/1484/Election-Results" | grep -io 'href="[^"]*\(2024\|result\|xls\|csv\|pdf\)[^"]*"' | sort -u | head -20
