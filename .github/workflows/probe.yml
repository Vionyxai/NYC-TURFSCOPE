# TEMPORARY: inspect the 2020 NYT precinct results file. Removed after use.
name: Probe
on:
  push:
    branches: [claude/code-review-testing-q7elwy]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://int.nyt.com/newsgraphics/elections/map-data/2020/national/precincts-with-results.geojson.gz
          curl -sI "$U" | grep -i "content-length\|content-type\|last-modified"
          time curl -s "$U" -o p.gz; ls -la p.gz
          echo "== first 600 bytes"; zcat p.gz | head -c 600; echo
          echo "== lines"; zcat p.gz | wc -l
          echo "== NY counties lines"; zcat p.gz | grep -c '"GEOID": *"360\(47\|81\|59\)\|"GEOID":"36\(047\|081\|059\|103\)' || true
          zcat p.gz | grep -o '"GEOID":"36\(047\|081\|059\|103\)[^"]*"' | head -5
          zcat p.gz | grep -o '"GEOID":"36\(047\|081\|059\|103\)' | sort | uniq -c
          echo "== a NY feature's properties"; zcat p.gz | grep -m1 -o '"properties":{"GEOID":"36081[^}]*}'
