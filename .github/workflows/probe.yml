# TEMPORARY: inspect the NYC DOF exemption dataset. Removed after use.
name: Probe
on:
  push:
    branches: [claude/code-review-testing-q7elwy]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://data.cityofnewyork.us
          echo "== catalog STAR"; curl -s "https://api.us.socrata.com/api/catalog/v1?domains=data.cityofnewyork.us&q=STAR%20exemption&limit=8" | jq -r '.results[] | [.resource.id, .resource.name, .resource.data_updated_at] | @tsv'
          echo "== catalog assessment"; curl -s "https://api.us.socrata.com/api/catalog/v1?domains=data.cityofnewyork.us&q=property%20valuation%20assessment&limit=8" | jq -r '.results[] | [.resource.id, .resource.name, .resource.data_updated_at] | @tsv'
          for d in 8y4t-faws yjxr-fw8i; do echo "== $d columns"; curl -s "$B/api/views/$d.json" | jq -r '.name, .rowsUpdatedAt, ([.columns[] | .fieldName] | join(" "))'; done
          echo "== 8y4t-faws one BK one-family"; curl -s -G "$B/resource/8y4t-faws.json" --data-urlencode "\$where=boro='3' AND bldg_class='A1'" --data-urlencode '$limit=1' | jq -c '.[0] | with_entries(select(.key|test("exm|star|exmp|own|name";"i")|not) )'
          echo "== 8y4t-faws exemption-ish columns sample"; curl -s -G "$B/resource/8y4t-faws.json" --data-urlencode "\$where=boro='3' AND bldg_class='A1'" --data-urlencode '$limit=3' | jq -c '.[] | with_entries(select(.key|test("exm|star|exmp";"i")))'
