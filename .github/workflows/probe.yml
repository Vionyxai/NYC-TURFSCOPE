# TEMPORARY: find Nassau/Suffolk 2024 results by election district + district maps. Removed after use.
name: Probe
on:
  push:
    branches: [claude/code-review-testing-q7elwy]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          A="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          echo "== openelections-sources 2024/general LI"; curl -s "https://api.github.com/repos/openelections/openelections-sources-ny/contents/2024/general" | jq -r '.[]? | "\(.name) \(.size) \(.download_url)"' | grep -i "nassau\|suffolk"
          echo "== Suffolk eleres 24ge"; for u in https://apps2.suffolkcountyny.gov/boe/eleres/24ge/default.htm https://apps2.suffolkcountyny.gov/boe/eleres/24ge/; do curl -sL -A "$A" -m 20 -o s.htm -w "%{http_code} %{size_download}\n" "$u"; grep -io 'href="[^"]*"' s.htm | head -30; done
          echo "== Suffolk ED layer"; L=https://gis.suffolkcountyny.gov/server/rest/services/LocalGovernmentSQLData/VotingPrecinct/FeatureServer/0
          curl -s "$L?f=json" | jq -c '{name, maxRecordCount, fields: [.fields[]?.name], extent: .extent.spatialReference}'
          curl -s "$L/query?where=1%3D1&returnCountOnly=true&f=json"; echo
          curl -s "$L/query?where=1%3D1&outFields=*&returnGeometry=false&resultRecordCount=3&f=json" | jq -c '.features[]?.attributes'
          echo "== Nassau GIS folders"; for f in FeatureServices MapServices Hosted; do echo "-- $f"; curl -s "https://gis.nassaucountyny.gov/server/rest/services/$f?f=json" | jq -r '.services[]? | "\(.name) \(.type)"' | head -60; done
          echo "== ArcGIS search Nassau"; for q in "Nassau%20County%20election%20district" "Nassau%20election%20district" "nassaucountyny%20election"; do curl -s "https://www.arcgis.com/sharing/rest/search?q=$q&num=10&f=json" | jq -r '.results[]? | [.type, .title, .owner, .url] | @tsv'; done
