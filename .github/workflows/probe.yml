# TEMPORARY: find Nassau/Suffolk 2024 results by election district + district maps. Removed after use.
name: Probe
on:
  push:
    branches: [claude/code-review-testing-q7elwy]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          A="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          echo "== openelections-sources-ny 2024/general"; curl -s "https://api.github.com/repos/openelections/openelections-sources-ny/contents/2024/general" | jq -r '.[]? | "\(.name) \(.size)"' | grep -i "nassau\|suffolk\|statewide\|^[A-Z]" | head -40
          echo "== Suffolk results page links"; curl -sL -A "$A" "https://www.suffolkvotes.com/Departments/BOE/Election-Results" -o suf.html; wc -c suf.html; grep -io 'href="[^"]*"' suf.html | grep -iv "facebook\|twitter\|instagram\|\.css\|\.js" | sort -u | head -60
          echo "== Suffolk GIS"; for h in https://gis.suffolkcountyny.gov/hosted/rest/services https://gis.suffolkcountyny.gov/server/rest/services https://gisapps.suffolkcountyny.gov/arcgis/rest/services; do echo "-- $h"; curl -s -m 20 "$h?f=json" | jq -c '{folders, services: [.services[]?.name]}' | head -c 1500; echo; done
          echo "== Nassau BOE"; for u in "https://www.nassaucountyny.gov/1484/Election-Results" "https://www.nassaucountyny.gov/552/Board-of-Elections" "https://www.nassaucountyny.gov/3418/Election-Results"; do echo "-- $u"; curl -sL -A "$A" -m 20 "$u" | grep -io 'href="[^"]*"' | grep -i "result\|2024\|canvass\|district\|xls\|csv\|pdf\|DocumentCenter" | sort -u | head -25; done
          echo "== Nassau GIS"; for h in https://gis.nassaucountyny.gov/arcgis/rest/services https://gis.nassaucountyny.gov/server/rest/services https://gis2.nassaucountyny.gov/arcgis/rest/services; do echo "-- $h"; curl -s -m 20 "$h?f=json" | jq -c '{folders, services: [.services[]?.name]}' | head -c 1500; echo; done
          echo "== ArcGIS Online search: election districts Nassau/Suffolk"; for q in "Nassau%20election%20districts" "Suffolk%20election%20districts" "Suffolk%20County%20election%20district"; do curl -s "https://www.arcgis.com/sharing/rest/search?q=$q&num=8&f=json" | jq -r '.results[]? | [.id, .type, .title, .owner, .url] | @tsv'; done
