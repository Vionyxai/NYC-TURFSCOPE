# TEMPORARY: inspect the NYC DOF exemption dataset. Removed after use.
name: Probe
on:
  push:
    branches: [claude/code-review-testing-q7elwy]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://data.cityofnewyork.us
          echo "== codes 2027/3"; curl -s -G "$B/resource/muvi-b6kx.json" --data-urlencode '$select=nys_exmp_code,exmp_code,exname,count(*)' --data-urlencode "\$where=year='2027' AND period=3" --data-urlencode '$group=nys_exmp_code,exmp_code,exname' --data-urlencode '$order=count(*) DESC' --data-urlencode '$limit=60' | jq -r '.[] | [.nys_exmp_code,.exmp_code,.count,.exname] | @tsv'
          echo "== STAR-ish lots BK/QN 2027/3"; curl -s -G "$B/resource/muvi-b6kx.json" --data-urlencode '$select=boro,count(*)' --data-urlencode "\$where=year='2027' AND period=3 AND nys_exmp_code in ('41854','41834')" --data-urlencode '$group=boro' | jq -c '.[]'
          echo "== periods by year"; curl -s -G "$B/resource/muvi-b6kx.json" --data-urlencode '$select=year,period,max(extractdt)' --data-urlencode '$group=year,period' --data-urlencode '$order=year DESC' --data-urlencode '$limit=4' | jq -c '.[]'
