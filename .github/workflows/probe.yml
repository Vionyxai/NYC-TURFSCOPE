# TEMPORARY: find Nassau/Suffolk 2024 results by election district + district maps. Removed after use.
name: Probe
on:
  push:
    branches: [claude/code-review-testing-q7elwy]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          L=https://gis.suffolkcountyny.gov/server/rest/services/LocalGovernmentSQLData/VotingPrecinct/FeatureServer/0
          curl -s "$L/query?where=1%3D1&outFields=PRECINCTID,NAME,MUNICIPALITY&returnGeometry=false&resultRecordCount=2000&f=json" | jq -r '.features[].attributes | "\(.PRECINCTID)|\(.NAME)"' | sort -t'|' -k1,1 > ids.txt
          wc -l ids.txt; awk -F'|' '{split($2,a," ED#"); k=a[1]":"substr($1,1,length($1)-3)":"length($1); c[k]++} END{for(k in c) print k, c[k]}' ids.txt | sort
          head -3 ids.txt; tail -3 ids.txt
          curl -s "$L/query?where=1%3D1&outFields=PRECINCTID&outSR=4326&f=geojson&resultRecordCount=1" | head -c 400; echo
