# TEMPORARY: hunt for Nassau 2024 results by election district. Removed after use.
name: Probe
on:
  push:
    branches: [claude/code-review-testing-q7elwy]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          A="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          curl -sL -A "$A" "https://www.nassaucountyny.gov/571/Election-Results" -o r.htm; wc -c r.htm
          grep -io '<a [^>]*href="[^"]*"[^>]*>[^<]*' r.htm | grep -i "2024\|2025\|result\|canvass\|district\|DocumentCenter\|xls\|csv" | sed 's/<a //' | head -40
          grep -io 'https\?://[^"<> ]*\(enr\|clarity\|results\)[^"<> ]*' r.htm | sort -u | head
