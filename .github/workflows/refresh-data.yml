# Pulls live Census / NYC / NYS data, scores tracts, builds walk lists, and commits
# m3-map/data/ back to the branch. Vercel redeploys on that commit.
# Run it from GitHub: Actions tab → Refresh data → Run workflow.
name: Refresh data
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh-data
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm test
      - name: TEMP probe Long Island address + parcel sources
        run: |
          G=https://gisservices.its.ny.gov/arcgis/rest/services
          echo "== service list"; curl -s "$G?f=json" | grep -o '"name":"[^"]*"' | grep -i -E 'address|parcel|sam' | head -20
          for svc in NYS_Address_Points NYS_Tax_Parcels_Public; do
            for kind in FeatureServer MapServer; do
              echo "== $svc/$kind layers"; curl -s "$G/$svc/$kind?f=json" | grep -o '"id":[0-9]*,"name":"[^"]*"' | head -10
            done
            echo "== $svc layer 0 fields"; curl -s "$G/$svc/FeatureServer/0?f=json" | grep -o '"name":"[^"]*","type":"[^"]*"' | head -60 | tr '\n' ' '; echo
            echo "== $svc sample"; curl -s "$G/$svc/FeatureServer/0/query?where=1%3D1&outFields=*&returnGeometry=false&resultRecordCount=1&f=json" | head -c 1500; echo
          done
          for c in Nassau Suffolk; do
            for f in COUNTY COUNTY_NAME CountyName County; do
              r=$(curl -s "$G/NYS_Address_Points/FeatureServer/0/query?where=$f%3D%27$c%27&returnCountOnly=true&f=json"); echo "addr $c ($f): $r" | head -c 200; echo
              r=$(curl -s "$G/NYS_Tax_Parcels_Public/FeatureServer/0/query?where=$f%3D%27$c%27&returnCountOnly=true&f=json"); echo "parcel $c ($f): $r" | head -c 200; echo
            done
          done
          exit 1
      - name: Run pipeline
        run: npm run pipeline
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          NYC_APP_TOKEN: ${{ secrets.NYC_APP_TOKEN }}
      - name: Summary
        run: |
          cat m3-map/data/summary.json
          du -sh m3-map/data m3-map/data/walklists 2>/dev/null || true
      - name: Upload office CSV
        uses: actions/upload-artifact@v5
        with:
          name: walklists_all
          path: exports/walklists_all.csv
          if-no-files-found: ignore
      - name: Commit map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A m3-map/data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Refresh map data ($(date -u +%Y-%m-%d))"
          git push
