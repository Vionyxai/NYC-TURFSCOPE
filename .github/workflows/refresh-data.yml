# Pulls live Census / NYC / NYS data, scores tracts, builds walk lists, and commits
# m3-map/data/ back to the branch. Vercel redeploys on that commit.
# Run it from GitHub: Actions tab → Refresh data → Run workflow.
name: Refresh data
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh-data
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm test
      - name: TEMP probe Long Island address + parcel sources
        run: |
          G=https://gisservices.its.ny.gov/arcgis/rest/services
          q() { curl -s --max-time 60 "$1" | head -c ${2:-1500}; echo; }
          echo "== which counties share parcels (footprint)"
          q "$G/NYS_Tax_Parcels_Public/FeatureServer/0/query?where=NAME%20IN%20(%27Nassau%27,%27Suffolk%27,%27Westchester%27)&outFields=NAME,DOS_LL,DOS_LL_DATE,DATEMOD&returnGeometry=false&f=json" 1200
          for svc in NYS_Tax_Parcels_Public/FeatureServer/1 NYS_Tax_Parcel_Centroid_Points/FeatureServer/0 NYS_Tax_Parcel_Centroid_Points/MapServer/0 SAM_Address_Points/FeatureServer/0 SAM_Address_Points/MapServer/0; do
            echo "== $svc fields"; curl -s --max-time 60 "$G/$svc?f=json" | grep -o '"name":"[^"]*","type":"esriField[^"]*"' | sed 's/"type":"esriFieldType/:/' | tr '\n' ' ' | head -c 2500; echo
          done
          echo "== SAM layers"; q "$G/SAM_Address_Points/FeatureServer?f=json" 800
          echo "== centroid layers"; q "$G/NYS_Tax_Parcel_Centroid_Points/FeatureServer?f=json" 800
          for c in Nassau Suffolk; do
            echo "== parcels in $c"; q "$G/NYS_Tax_Parcels_Public/FeatureServer/1/query?where=COUNTY_NAME%3D%27$c%27&returnCountOnly=true&f=json" 300
            echo "== centroids in $c"; q "$G/NYS_Tax_Parcel_Centroid_Points/FeatureServer/0/query?where=COUNTY_NAME%3D%27$c%27&returnCountOnly=true&f=json" 300
            echo "== SAM points in $c (COUNTY)"; q "$G/SAM_Address_Points/FeatureServer/0/query?where=County%3D%27$c%27&returnCountOnly=true&f=json" 300
          done
          echo "== centroid sample Suffolk"; q "$G/NYS_Tax_Parcel_Centroid_Points/FeatureServer/0/query?where=COUNTY_NAME%3D%27Suffolk%27&outFields=*&returnGeometry=true&outSR=4326&resultRecordCount=2&f=json" 3000
          echo "== SAM sample (bbox Massapequa)"; q "$G/SAM_Address_Points/FeatureServer/0/query?geometry=-73.48,40.66,-73.46,40.68&geometryType=esriGeometryEnvelope&inSR=4326&outFields=*&returnGeometry=true&outSR=4326&resultRecordCount=2&f=json" 3000
          echo "== SAM count (bbox Massapequa)"; q "$G/SAM_Address_Points/FeatureServer/0/query?geometry=-73.48,40.66,-73.46,40.68&geometryType=esriGeometryEnvelope&inSR=4326&returnCountOnly=true&f=json" 300
          exit 1
      - name: Run pipeline
        run: npm run pipeline
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          NYC_APP_TOKEN: ${{ secrets.NYC_APP_TOKEN }}
      - name: Summary
        run: |
          cat m3-map/data/summary.json
          du -sh m3-map/data m3-map/data/walklists 2>/dev/null || true
      - name: Upload office CSV
        uses: actions/upload-artifact@v5
        with:
          name: walklists_all
          path: exports/walklists_all.csv
          if-no-files-found: ignore
      - name: Commit map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A m3-map/data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Refresh map data ($(date -u +%Y-%m-%d))"
          git push
