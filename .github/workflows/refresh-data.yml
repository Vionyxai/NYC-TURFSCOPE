# Pulls live Census / NYC / NYS data, scores tracts, builds walk lists, and commits
# m3-map/data/ back to the branch. Vercel redeploys on that commit.
# Run it from GitHub: Actions tab → Refresh data → Run workflow.
name: Refresh data
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh-data
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm test
      - name: TEMP diagnose missing Suffolk tracts
        env:
          K: ${{ secrets.CENSUS_API_KEY }}
        run: |
          B=https://api.census.gov/data
          T=145601,145602,122406,201200,145701
          for u in "$B/2024/acs/acs5?get=NAME,B25024_001E&for=tract:$T&in=state:36%20county:103" \
                   "$B/2023/acs/acs5?get=NAME,B25024_001E&for=tract:$T&in=state:36%20county:103" \
                   "$B/2020/dec/pl?get=NAME,P1_001N&for=tract:$T&in=state:36%20county:103" \
                   "$B/2024/acs/acs5?get=NAME&for=tract:*&in=state:36%20county:103"; do
            echo "== ${u%%\?*} ${u#*for=}"; curl -s "$u&key=$K" | head -c 1500 | grep -o '"[^"]*1456[^"]*\|"[^"]*1224\.0[0-9][^"]*\|"[^"]*2012[^"]*\|error[^<]*' | head -20; echo; done
          curl -s "$B/2024/acs/acs5?get=NAME&for=tract:*&in=state:36%20county:103&key=$K" | grep -c tract || true
          curl -s "$B/2024/acs/acs5?get=NAME&for=tract:*&in=state:36%20county:103&key=$K" | grep -o '14[56][0-9]\.[0-9]*;' | tr '\n' ' '
          exit 1
      - name: Run pipeline
        run: npm run pipeline
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          NYC_APP_TOKEN: ${{ secrets.NYC_APP_TOKEN }}
      - name: Summary
        run: |
          cat m3-map/data/summary.json
          du -sh m3-map/data m3-map/data/walklists 2>/dev/null || true
      - name: Upload office CSV
        uses: actions/upload-artifact@v5
        with:
          name: walklists_all
          path: exports/walklists_all.csv
          if-no-files-found: ignore
      - name: Commit map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A m3-map/data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Refresh map data ($(date -u +%Y-%m-%d))"
          git push
