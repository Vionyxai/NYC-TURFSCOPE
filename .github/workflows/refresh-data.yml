# Pulls live Census / NYC / NYS data, scores tracts, builds walk lists, and commits
# m3-map/data/ back to the branch. Vercel redeploys on that commit.
# Run it from GitHub: Actions tab → Refresh data → Run workflow.
name: Refresh data
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh-data
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm test
      - name: TEMP inspect business + PLUTO fields
        run: |
          echo "== DCWP one row"; curl -s 'https://data.cityofnewyork.us/resource/w7w3-xahh.json?$limit=1' | head -c 2500; echo
          echo "== DCWP Queens active business count"; curl -s 'https://data.cityofnewyork.us/resource/w7w3-xahh.json?$select=count(*)&$where=address_borough=%27Queens%27' ; echo
          echo "== DCWP distinct license_type/status"; curl -s 'https://data.cityofnewyork.us/resource/w7w3-xahh.json?$select=license_type,license_status,count(*)&$group=license_type,license_status' ; echo
          echo "== DCWP top industries Queens"; curl -s 'https://data.cityofnewyork.us/resource/w7w3-xahh.json?$select=business_category,count(*)&$group=business_category&$order=count(*)%20desc&$limit=15' ; echo
          echo "== PLUTO mixed fields"; curl -s 'https://data.cityofnewyork.us/resource/64uk-42ks.json?$select=bbl,bldgclass,comarea,officearea,retailarea,landuse,unitsres&$where=borough=%27QN%27%20AND%20bldgclass%20like%20%27S%25%27&$limit=3' ; echo
          exit 1
      - name: Run pipeline
        run: npm run pipeline
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          NYC_APP_TOKEN: ${{ secrets.NYC_APP_TOKEN }}
      - name: Summary
        run: |
          cat m3-map/data/summary.json
          du -sh m3-map/data m3-map/data/walklists 2>/dev/null || true
      - name: Upload office CSV
        uses: actions/upload-artifact@v5
        with:
          name: walklists_all
          path: exports/walklists_all.csv
          if-no-files-found: ignore
      - name: Commit map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A m3-map/data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Refresh map data ($(date -u +%Y-%m-%d))"
          git push
