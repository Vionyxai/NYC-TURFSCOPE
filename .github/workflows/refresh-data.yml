# Pulls live Census / NYC / NYS data, scores tracts, builds walk lists, and commits
# m3-map/data/ back to the branch. Vercel redeploys on that commit.
# Run it from GitHub: Actions tab → Refresh data → Run workflow.
name: Refresh data
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh-data
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm test
      - name: TEMP probe Long Island address + parcel sources
        run: |
          C=https://gisservices.its.ny.gov/arcgis/rest/services/NYS_Tax_Parcel_Centroid_Points/MapServer/0/query
          stat() { curl -s --max-time 120 "$C?where=$1&groupByFieldsForStatistics=$2&outStatistics=%5B%7B%22statisticType%22%3A%22count%22%2C%22onStatisticField%22%3A%22OBJECTID%22%2C%22outStatisticFieldName%22%3A%22n%22%7D%5D&orderByFields=n%20DESC&f=json" | grep -o '"attributes":{[^}]*}' | head -${3:-15}; }
          for c in Nassau Suffolk; do
            R="COUNTY_NAME%3D%27$c%27%20AND%20PROP_CLASS%20IN%20(%27210%27,%27215%27,%27220%27,%27230%27,%27280%27,%27281%27,%27283%27)"
            echo "=== $c: 1-3 family residential by class"; stat "COUNTY_NAME%3D%27$c%27%20AND%20PROP_CLASS%20LIKE%20%272%25%27" PROP_CLASS 12
            echo "=== $c: fuel type (1-3 family)"; stat "$R" FUEL_TYPE_DESC 10
            echo "=== $c: heat type (1-3 family)"; stat "$R" HEAT_TYPE_DESC 8
            echo "=== $c: year built present?"; curl -s "$C?where=$R%20AND%20YR_BLT%20%3E%201800&returnCountOnly=true&f=json"; echo
            echo "=== $c: address present?"; curl -s "$C?where=$R%20AND%20PARCEL_ADDR%20IS%20NOT%20NULL&returnCountOnly=true&f=json"; echo
            echo "=== $c: sample (no owner fields)"; curl -s --max-time 120 "$C?where=$R&outFields=PARCEL_ADDR,LOC_ZIP,MUNI_NAME,PROP_CLASS,YR_BLT,SQFT_LIVING,FUEL_TYPE_DESC,HEAT_TYPE_DESC,NBR_KITCHENS,ROLL_YR&returnGeometry=true&outSR=4326&resultRecordCount=3&f=json" | grep -o '"attributes":{[^}]*},"geometry":{[^}]*}'
          done
          echo "=== max record count"; curl -s "https://gisservices.its.ny.gov/arcgis/rest/services/NYS_Tax_Parcel_Centroid_Points/MapServer/0?f=json" | grep -o '"maxRecordCount":[0-9]*\|"supportsPagination":[a-z]*\|"supportsAdvancedQueries":[a-z]*'
          exit 1
      - name: Run pipeline
        run: npm run pipeline
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          NYC_APP_TOKEN: ${{ secrets.NYC_APP_TOKEN }}
      - name: Summary
        run: |
          cat m3-map/data/summary.json
          du -sh m3-map/data m3-map/data/walklists 2>/dev/null || true
      - name: Upload office CSV
        uses: actions/upload-artifact@v5
        with:
          name: walklists_all
          path: exports/walklists_all.csv
          if-no-files-found: ignore
      - name: Commit map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A m3-map/data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Refresh map data ($(date -u +%Y-%m-%d))"
          git push
