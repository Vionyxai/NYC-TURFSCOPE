<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TurfScope NYC</title>
<!-- iPhone: Share → Add to Home Screen runs this full screen like an app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TurfScope">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #ffffff; --fg: #111827; --muted: #6b7280; --line: #e5e7eb; --chip: #f3f4f6;
    --accent: #111827; --accent-fg: #ffffff; --shadow: 0 -8px 24px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111318; --fg: #f3f4f6; --muted: #9ca3af; --line: #262a33; --chip: #1d2129;
            --accent: #f3f4f6; --accent-fg: #111318; --shadow: 0 -8px 24px rgba(0,0,0,.5); }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { overscroll-behavior: none; }
  button, a, .item, label { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  input { font-size: 16px; } /* smaller than 16px makes iPhone zoom in on tap */
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  header { padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 8px; border-bottom: 1px solid var(--line);
    background: var(--bg); z-index: 1000; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .title { font-weight: 700; letter-spacing: .02em; margin-right: auto; }
  .meta { color: var(--muted); font-size: 12px; }
  .seg { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--fg); padding: 7px 10px; border-radius: 8px; font: inherit; font-size: 13px; }
  .seg button.on { background: var(--accent); color: var(--accent-fg); }
  .chip { border: 1px solid var(--line); background: var(--chip); color: var(--fg); border-radius: 999px; padding: 6px 10px; font: inherit; font-size: 13px; }
  .chip.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  select.chip { appearance: none; }
  label.slider { display: flex; align-items: center; gap: 6px; font-size: 13px; flex: 1; min-width: 160px; }
  label.slider input { flex: 1; }
  #map { flex: 1; }
  .legend { position: absolute; left: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 900;
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; font-size: 11px; }
  .legend .bar { display: flex; height: 8px; width: 140px; border-radius: 4px; overflow: hidden; margin: 4px 0; }
  .legend .bar span { flex: 1; }
  .legend .ut { display: flex; gap: 8px; margin-top: 4px; }
  .legend .ut i { display: inline-block; width: 10px; height: 10px; border: 2px solid; border-radius: 2px; vertical-align: -1px; margin-right: 3px; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1100; background: var(--bg); box-shadow: var(--shadow);
    border-radius: 16px 16px 0 0; padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 14px);
    max-height: 70%; overflow-y: auto; transform: translateY(105%); transition: transform .2s ease; }
  .sheet.open { transform: translateY(0); }
  .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 10px; }
  .score { font-size: 34px; font-weight: 800; line-height: 1; }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin: 12px 0; }
  .kv div span { display: block; color: var(--muted); font-size: 12px; }
  .bars { margin: 8px 0 12px; }
  .bars .b { display: grid; grid-template-columns: 80px 1fr 34px; gap: 8px; align-items: center; font-size: 12px; margin: 3px 0; }
  .bars .track { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
  .bars .fill { height: 100%; background: var(--accent); }
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 12px; font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-fg); margin-top: 8px; }
  .btn.ghost { background: var(--chip); color: var(--fg); }
  .panel { position: fixed; inset: 0; z-index: 1200; background: var(--bg); display: none; flex-direction: column; }
  .panel.open { display: flex; }
  .panel header { display: flex; gap: 8px; align-items: center; }
  .panel .list { flex: 1; overflow-y: auto; padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 12px); }
  .item { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .item .s { font-weight: 800; width: 34px; text-align: center; }
  .item .a { flex: 1; }
  .item .a small { display: block; color: var(--muted); }
  .item a { color: inherit; font-size: 13px; }
  .badge { font-size: 11px; padding: 2px 6px; border-radius: 6px; border: 1px solid; margin-left: 4px; }
  .empty { padding: 24px; color: var(--muted); text-align: center; }
  .warn { margin: 8px 0; padding: 8px 10px; border-radius: 10px; background: var(--chip); border-left: 4px solid #6b7280; font-size: 13px; }
  .locate { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    font-size: 20px; line-height: 1; box-shadow: 0 1px 4px rgba(0,0,0,.2); display: flex; align-items: center; justify-content: center; }
  .locate.on { background: #2563eb; color: #fff; border-color: #2563eb; }
  .locate.track { color: #2563eb; border-color: #2563eb; }
  .here { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px;
    font-size: 13px; box-shadow: 0 1px 4px rgba(0,0,0,.2); max-width: calc(100vw - 90px); display: none; }
  .here.show { display: block; }
  .here b { font-size: 16px; margin-right: 4px; }
  .group { margin: 10px 0 14px; }
  .group h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .group .row { gap: 8px; }
  .group .chip { padding: 9px 14px; font-size: 14px; }
  .walkbar { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .walkbar .meta { flex: 1; min-width: 120px; }
  .item .d { font-size: 12px; color: var(--muted); text-align: right; min-width: 52px; }
  .item .d a { display: block; margin-top: 2px; padding: 4px 0; }
  .panel .list { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .item[data-w] { cursor: pointer; min-height: 56px; }
  .kn { display: block; font-size: 12px; font-weight: 600; margin-top: 2px; }
  .acct { margin-left: 4px; }
  .acct.warn { border-color: #b45309; color: #b45309; }
  #acctSheet, #knockSheet, #noteSheet { z-index: 1300; max-height: 88%; }
  textarea.note { display: block; width: 100%; min-height: 76px; margin-top: 6px; padding: 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--chip); color: var(--fg); font: inherit; font-size: 16px; resize: vertical; }
  .notes { margin: 8px 0; }
  .note-item { padding: 8px 10px; margin: 6px 0; border-radius: 10px; background: var(--chip); font-size: 14px; }
  .note-item .who { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .note-item button { float: right; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12px; padding: 4px 6px; text-decoration: underline; }
  .turfrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0; }
  .turfrow button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--chip); color: var(--fg); font: inherit; font-size: 13px; font-weight: 600; }
  .turfrow button.cur { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .section { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }
  .section h4 { margin: 0 0 6px; }
  .rep-label { background: transparent; border: 0; box-shadow: none; font: 700 11px/1 -apple-system, sans-serif; padding: 3px 6px; border-radius: 6px; color: #fff; white-space: nowrap; }
  .rep-label::before { display: none; }
  .mine-list .item { cursor: pointer; }
  .snip { display: block; font-size: 12px; color: var(--fg); margin-top: 2px; }
  .field { display: block; margin: 10px 0; font-size: 13px; color: var(--muted); }
  .field input { display: block; width: 100%; margin-top: 4px; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--chip); color: var(--fg); font: inherit; font-size: 16px; }
  .err { color: #b91c1c; font-size: 13px; min-height: 18px; margin-top: 6px; }
  .kgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 4px; }
  .kgrid button { min-height: 56px; border: 0; border-radius: 12px; color: #fff; font: inherit; font-weight: 700; font-size: 16px; }
  .kgrid button.wide { grid-column: 1 / -1; }
  .kgrid button.cur { outline: 3px solid var(--fg); outline-offset: 2px; }
  .fchips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .fchips .chip { padding: 10px 14px; font-size: 15px; }
  .score-table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0; }
  .score-table th, .score-table td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  .score-table td.n, .score-table th.n { text-align: right; }
  .toast { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 1400;
    background: var(--fg); color: var(--bg); border-radius: 12px; padding: 12px 14px; display: none; align-items: center; gap: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,.3); font-size: 15px; }
  .toast.show { display: flex; }
  .toast span { flex: 1; }
  .toast button { border: 0; background: transparent; color: var(--bg); font: inherit; font-weight: 700; padding: 8px; text-decoration: underline; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="row" style="margin-bottom:8px">
      <div class="title">TurfScope NYC</div>
      <div class="meta" id="meta">Loading…</div>
      <button class="chip acct" id="acctBtn" style="display:none">Sign in</button>
    </div>
    <div class="row" style="margin-bottom:6px">
      <div class="seg" id="utilSeg">
        <button data-u="all" class="on">All</button>
        <button data-u="coned">Con Ed</button>
        <button data-u="psegli">PSEG LI</button>
        <button data-u="muni">Village</button>
      </div>
      <button class="chip" id="dacBtn">DAC only</button>
      <button class="chip" id="targetBtn">Target</button>
    </div>
    <div class="row">
      <label class="slider">Min score <input type="range" id="minScore" min="0" max="100" step="5" value="0"><b id="minVal">0</b></label>
      <button class="chip" id="mineBtn" style="display:none">Mine</button>
      <button class="chip" id="bestBtn">Best turf</button>
    </div>
  </header>
  <div id="map"></div>
  <div class="legend">
    <div>TurfScore</div>
    <div class="bar" id="legendBar"></div>
    <div style="display:flex;justify-content:space-between"><span>0</span><span>100</span></div>
    <div class="ut" id="legendUt"></div>
    <div class="ut" id="legendReps"></div>
  </div>
</div>

<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

<div class="sheet" id="targetSheet">
  <div class="grab"></div>
  <div class="row"><div class="title">Target</div><button class="chip" id="targetClear">Clear all</button></div>
  <div class="meta">Pick any mix. Nothing picked in a group means any.</div>
  <div class="group"><h4>Income (tract median)</h4><div class="row" id="tgIncome"></div></div>
  <div class="group"><h4>Home age (year built)</h4><div class="row" id="tgHome"></div></div>
  <div class="group"><h4>Homeowner age (rough estimate) — more than usual</h4><div class="row" id="tgAge"></div></div>
  <div class="group"><h4>House size</h4><div class="row" id="tgSize"></div></div>
  <button class="btn" id="targetDone">Show tracts</button>
</div>

<div class="sheet" id="acctSheet"><div class="grab"></div><div id="acctBody"></div></div>
<div class="sheet" id="knockSheet"><div class="grab"></div><div id="knockBody"></div></div>
<div class="sheet" id="noteSheet"><div class="grab"></div><div id="noteBody"></div></div>
<div class="toast" id="toast"><span id="toastText"></span><button id="toastUndo">Undo</button></div>

<div class="panel" id="panel">
  <header>
    <button class="chip" id="panelBack">‹ Back</button>
    <div class="title" id="panelTitle"></div>
    <button class="chip" id="csvBtn" style="display:none">CSV</button>
  </header>
  <div class="walkbar" id="walkBar" style="display:none">
    <div class="seg" id="walkSort">
      <button data-s="walk" class="on">Walk order</button>
      <button data-s="near">Nearest</button>
    </div>
    <button class="chip" id="hideDone" style="display:none">Hide done</button>
    <div class="meta" id="walkMeta"></div>
  </div>
  <div class="list" id="panelList"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="team.js"></script>
<script>
(async function () {
  if (typeof L === 'undefined') { document.getElementById('meta').textContent = 'Map failed to load — check your connection and refresh'; return; }
  const COLORS = ['#b91c1c', '#ea580c', '#eab308', '#65a30d', '#15803d'];
  const colorFor = (s) => COLORS[Math.min(4, Math.floor((s || 0) / 20))];
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pct = (x) => (x == null ? '—' : Math.round(x * 100) + '%');
  const money = (x) => (x == null ? '—' : '$' + Math.round(x / 1000) + 'k');

  let placingPin = false;                                      // true after "Tap a spot on the map"
  const state = { util: 'all', dac: false, mine: false, min: 0, incomes: new Set(), homes: new Set(), ages: new Set(), sizes: new Set() };
  let data, summary, walkIndex = {}, layer, currentList = null;

  const map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([40.72, -73.75], 11);
  L.control.zoom({ position: 'topright' }).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap contributors',
  }).addTo(map);

  try {
    [data, summary] = await Promise.all([
      fetch('data/tracts.geojson').then((r) => r.json()),
      fetch('data/summary.json').then((r) => r.json()),
    ]);
  } catch (e) {
    document.getElementById('meta').textContent = 'No data yet — run npm run pipeline';
    return;
  }
  try { walkIndex = await fetch('data/walklists/index.json').then((r) => (r.ok ? r.json() : {})); } catch (e) { walkIndex = {}; }
  let appCfg = null;
  try { appCfg = await fetch('data/app.json').then((r) => (r.ok ? r.json() : null)); } catch (e) { appCfg = null; }

  const UT = summary.utilities || {};
  const utColor = (u) => (UT[u] && UT[u].color) || '#6b7280';
  const utLabel = (u) => (UT[u] && UT[u].label) || u;

  document.getElementById('meta').textContent = `${summary.tracts} tracts`;
  document.getElementById('legendBar').innerHTML = COLORS.map((c) => `<span style="background:${c}"></span>`).join('');
  document.getElementById('legendUt').innerHTML = Object.keys(UT)
    .map((u) => `<span><i style="border-color:${utColor(u)}"></i>${esc(UT[u].label)}</span>`).join('');

  const TG = { income_bands: [], owner_age_bands: [], home_age_bands: [], size_bands: [], owner_age_avg: {}, ...(summary.targeting || {}) };
  const sizeLabel = (k) => (TG.size_bands.find((b) => b.key === k) || {}).label || '';
  const homeLabel = (k) => (TG.home_age_bands.find((b) => b.key === k) || {}).label || '';
  // Walk list: the house-level targets (home age, house size) filter each lot by its own facts.
  const lotPasses = (r) => (!state.homes.size || state.homes.has(r.age)) && (!state.sizes.size || state.sizes.has(r.size));

  // Homeowner age: the tract has more homeowners in the picked ages than the turf as a whole.
  function ageOK(p) {
    if (!p.owner_age) return false;
    let mine = 0, avg = 0;
    for (const k of state.ages) { mine += p.owner_age[k] || 0; avg += TG.owner_age_avg[k] || 0; }
    return mine >= avg - 0.005;
  }

  // ---------- Knock tracking (Supabase) ----------
  let storage;
  try { storage = window.localStorage; storage.getItem('ts.test'); } catch (e) {
    const m = new Map(); storage = { getItem: (k) => (m.has(k) ? m.get(k) : null), setItem: (k, v) => m.set(k, v), removeItem: (k) => m.delete(k) };
  }
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
    : ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, (c) => (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16)));
  const K = window.TurfTeam ? window.TurfTeam.createTeam({ supabase: appCfg && appCfg.supabase, storage, fetch: window.fetch.bind(window), uuid, noteMax: appCfg && appCfg.note_max })
    : { enabled: false, signedIn: () => false, me: () => null, latest: () => null, turf: () => null, allTurf: () => new Map(), notesFor: () => [], houseNotesInTract: () => [], pins: () => [], pendingCount: () => 0, onChange: () => {} };
  const REPCOLOR = Object.fromEntries(((appCfg && appCfg.reps) || []).map((r) => [r.name, r.color]));
  const repColor = (name) => REPCOLOR[name] || '#374151';
  const TURF = Object.fromEntries(((appCfg && appCfg.turf_statuses) || []).map((x) => [x.key, x]));
  const NOTE_MAX = (appCfg && appCfg.note_max) || 280;
  // Active area status for a tract (an "open" entry means nobody has it).
  const turfOf = (geoid) => { const t = K.turf(geoid); return t && t.status !== 'open' ? t : null; };
  const noteWho = (n) => `${esc(n.rep || '')} · ${esc(fmtWhen(n.noted_at))}${n.pending ? ' · waiting to sync' : ''}${n.failed ? ' · NOT SAVED' : ''}`;
  function noteList(list, emptyText) {
    const me = K.me();
    if (!list.length) return emptyText ? `<div class="meta">${emptyText}</div>` : '';
    return `<div class="notes">${list.map((n) => `<div class="note-item">${(n.mine || (me && me.is_admin)) ? `<button data-del="${esc(n.client_id)}">Delete</button>` : ''}${esc(n.body)}<span class="who">${noteWho(n)}</span></div>`).join('')}</div>`;
  }
  // Wires a note box (textarea + Save) and the Delete buttons inside a container.
  function wireNotes(box, makeNote, after) {
    box.querySelectorAll('[data-del]').forEach((b) => (b.onclick = async () => {
      try { await K.deleteNote(b.dataset.del); after(); } catch (ex) { toast(`Couldn't delete: ${ex.message}`); }
    }));
    const ta = box.querySelector('textarea.note'), save = box.querySelector('[data-save-note]'), err = box.querySelector('.err');
    if (!ta || !save) return;
    save.onclick = () => {
      try { K.addNote({ ...makeNote(), body: ta.value }); ta.value = ''; if (err) err.textContent = ''; toast('Note shared with the team'); after(); }
      catch (ex) { if (err) err.textContent = ex.message; }
    };
  }
  const noteBox = (placeholder) => `<textarea class="note" maxlength="${NOTE_MAX}" placeholder="${esc(placeholder)}"></textarea>
    <div class="err"></div><button class="btn" data-save-note>Save note</button>`;
  const STATUSES = (appCfg && appCfg.statuses) || [];
  const STATUS = Object.fromEntries(STATUSES.map((x) => [x.key, x]));
  const FOLLOW = Object.fromEntries(((appCfg && appCfg.followups) || []).map((x) => [x.key, x.label]));
  const canKnock = () => K.enabled && K.signedIn() && !!K.me();
  const fmtWhen = (iso) => {
    const d = new Date(iso); if (isNaN(d)) return '';
    return d.toDateString() === new Date().toDateString()
      ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
      : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  };
  const standalone = () => window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

  const passes = (p) =>
    (state.util === 'all' || p.utility === state.util) &&
    (!state.dac || p.dac === true) &&
    (!state.incomes.size || state.incomes.has(p.income_band)) &&
    (!state.homes.size || state.homes.has(p.home_age_band)) &&
    (!state.ages.size || ageOK(p)) &&
    (!state.sizes.size || state.sizes.has(p.size_band)) &&
    p.score >= state.min &&
    (!state.mine || (turfOf(p.geoid) && turfOf(p.geoid).rep === (K.me() && K.me().name)));

  // Rep-name labels on claimed turf and team pins, redrawn when the team's data changes.
  const overlay = L.layerGroup().addTo(map);
  function drawOverlay() {
    overlay.clearLayers();
    if (!K.enabled || !K.signedIn()) return;
    if (map.getZoom() >= 12) {
      for (const f of data.features) {
        const t = turfOf(f.properties.geoid);
        if (!t || !passes(f.properties)) continue;
        const c = L.geoJSON(f).getBounds().getCenter();
        const label = `${t.rep}${t.status === 'finished' ? ' ✓' : t.status === 'avoid' ? ' · avoid' : ''}`;
        L.marker(c, { interactive: false, icon: L.divIcon({ className: '', html: `<span class="rep-label" style="background:${t.status === 'avoid' ? '#111827' : repColor(t.rep)}">${esc(label)}</span>`, iconSize: null }) }).addTo(overlay);
      }
    }
    for (const n of K.pins()) {
      const m = L.circleMarker([n.lat, n.lon], { radius: 9, weight: 3, color: '#ffffff', fillColor: repColor(n.rep), fillOpacity: 1 });
      m.on('click', (e) => { L.DomEvent.stopPropagation(e); openPin(n); });
      m.addTo(overlay);
    }
  }
  map.on('zoomend', () => drawOverlay());

  function render() {
    if (layer) layer.remove();
    layer = L.geoJSON(data, {
      filter: (f) => passes(f.properties),
      style: (f) => {
        const t = turfOf(f.properties.geoid);
        const base = { fillColor: colorFor(f.properties.score), fillOpacity: 0.55, color: utColor(f.properties.utility), weight: 1.2, opacity: 0.9 };
        if (!t) return base;
        // Claimed = solid outline in the rep's color, finished = dashed, avoid = dark dotted and faded.
        if (t.status === 'avoid') return { ...base, color: '#111827', weight: 3, dashArray: '2 6', fillOpacity: 0.2 };
        return { ...base, color: repColor(t.rep), weight: 4, dashArray: t.status === 'finished' ? '8 6' : null, fillOpacity: t.status === 'finished' ? 0.3 : 0.55 };
      },
      onEachFeature: (f, l) => l.on('click', (e) => {
        L.DomEvent.stopPropagation(e);
        if (placingPin) { placingPin = false; openPinEditor(e.latlng.lat, e.latlng.lng); return; }  // dropping a pin, not opening the card
        openSheet(f.properties);
      }),
    }).addTo(map);
    if (typeof drawOverlay === 'function') drawOverlay();
  }

  let cardOpen = null;                                         // the tract whose card is showing, for live updates
  function openSheet(p) {
    cardOpen = p;
    const fuel = p.fuel || {};
    const parts = p.parts || {};
    const w = summary.weights || {};
    const hasList = walkIndex[p.geoid];
    document.getElementById('sheetBody').innerHTML = `
      <div class="row">
        <div class="score" style="color:${colorFor(p.score)}">${p.score}</div>
        <div style="margin-left:10px">
          <div><b>${esc(p.county_name)}</b> · tract ${esc(p.geoid.slice(5))}</div>
          <div class="meta">
            <span class="badge" style="border-color:${utColor(p.utility)};color:${utColor(p.utility)}">${esc(utLabel(p.utility))}</span>
            ${p.utility_split ? '<span class="badge">split utility</span>' : ''}
            ${p.dac ? '<span class="badge">DAC</span>' : ''}
            ${p.estimated_from ? '<span class="badge">estimated</span>' : ''}
            ${p.renter_heavy ? `<span class="badge" style="border-color:#b45309;color:#b45309">renter-heavy ${pct(p.renter)}</span>` : ''}
            ${p.muni && p.utility !== 'muni' ? `<span class="badge" style="border-color:#6b7280">part village electric</span>` : ''}
          </div>
        </div>
      </div>
      <div class="kv">
        <div><span>1–4 unit homes</span>${p.homes.toLocaleString()}${p.homes_source === 'acs_est' ? ' <small class="meta">(est.)</small>' : ''}</div>
        <div><span>Median income</span>${money(p.median_income)} ${p.income_band ? `<small class="meta">${esc(p.income_band)}</small>` : ''}</div>
        <div><span>Home age</span>${p.year_built ? `${esc(homeLabel(p.home_age_band))} <small class="meta">median ${p.year_built <= 1939 && p.homes_source !== 'pluto' ? '1939 or earlier' : p.year_built}</small>` : '—'}</div>
        <div><span>Built before 1980</span>${pct(p.pre1980)}</div>
        <div><span>Owners / renters</span>${pct(p.owner)} / ${pct(p.renter)}</div>
        ${p.homes_source === 'pluto' ? `<div><span>Homes with rental units</span>${(p.rental_unit_lots ?? 0).toLocaleString()} <small class="meta">2–4 family</small></div>
        <div><span>Homes with a business</span>${(p.business_lots ?? 0).toLocaleString()}</div>` : ''}
        <div><span>Homeowner age (est.)</span>${p.owner_age ? TG.owner_age_bands.map((b) => `${esc(b.label)} ${pct(p.owner_age[b.key])}`).join(' · ') : '—'}</div>
        <div><span>House size</span>${p.size_band ? `${esc(sizeLabel(p.size_band))} <small class="meta">${p.size_basis === 'sqft' ? `median ${Math.round(p.size_value).toLocaleString()} sq ft` : `median ${p.size_value} rooms`}</small>` : '—'}</div>
        <div><span>Heat: oil / gas / elec</span>${pct(fuel.oil)} / ${pct(fuel.gas)} / ${pct(fuel.electric)}</div>
      </div>
      <div class="bars">
        ${Object.keys(w).map((k) => `
          <div class="b"><span>${k}</span><div class="track"><div class="fill" style="width:${w[k] ? ((parts[k] || 0) / w[k]) * 100 : 0}%"></div></div><span>${parts[k] ?? 0}</span></div>`).join('')}
      </div>
      ${p.muni ? `<div class="warn"><b>${esc(p.muni.label)}</b> — a village-run electric utility, not PSEG LI — covers ${pct(p.muni.share)} of this tract. Homes there may not qualify for PSEG LI heat pump rebates. Check before knocking.</div>` : ''}
      ${p.estimated_from ? `<div class="meta">No Census survey data for this tract — numbers estimated from nearby tract ${esc(p.estimated_from.slice(5))}.</div>` : ''}
      ${p.gaps && p.gaps.length ? `<div class="meta">Missing data: ${esc(p.gaps.join(', '))}</div>` : ''}
      ${hasList && canKnock() ? '<div class="meta" id="progLine" style="margin-top:8px">Team progress: loading…</div>' : ''}
      ${canKnock() ? `<div class="section" id="turfBox"></div><div class="section" id="areaNotes"></div>` : ''}
      ${hasList
        ? `<button class="btn" id="walkBtn">Walk list · ${hasList} homes</button>`
        : `<div class="meta" style="margin-top:8px">No address-level list for this tract yet.</div>`}
      <button class="btn ghost" id="closeSheet">Close</button>`;
    document.getElementById('sheet').classList.add('open');
    openedAt = Date.now();
    document.getElementById('closeSheet').onclick = () => { openedAt = 0; closeSheet(); };
    if (hasList) document.getElementById('walkBtn').onclick = () => openWalk(p);
    if (canKnock()) {
      paintTractTeam(p);
      K.loadTract(p.geoid).catch(() => { /* offline: show what we have */ });   // area notes + house statuses; the card repaints on arrival
    }
    if (hasList && canKnock()) {
      K.tractProgress(p.geoid).then((g) => {
        const el = document.getElementById('progLine');
        if (el) el.textContent = `Team progress: ${g.knocked} of ${hasList} knocked · ${g.booked} booked · ${g.interested || 0} interested · ${g.come_back || 0} come back`;
      }).catch(() => { const el = document.getElementById('progLine'); if (el) el.textContent = 'Team progress: offline'; });
    }
  }
  // Who has this area, the buttons to change it, and the team's notes about it.
  function paintTractTeam(p) {
    const box = document.getElementById('turfBox'), nb = document.getElementById('areaNotes');
    if (!box || !nb) return;
    const t = K.turf(p.geoid);
    const cur = t ? t.status : 'open';
    const me = K.me();
    const who = t && t.status !== 'open'
      ? `<b style="color:${t.status === 'avoid' ? 'inherit' : repColor(t.rep)}">${esc((TURF[t.status] || {}).label || t.status)}</b> by ${esc(t.rep)} · ${esc(fmtWhen(t.set_at))}${t.pending ? ' · waiting to sync' : ''}`
      : 'Open — nobody has claimed this area';
    box.innerHTML = `<h4>Turf</h4><div>${who}</div>
      <div class="turfrow">${Object.values(TURF).map((x) => `<button data-turf="${esc(x.key)}" class="${cur === x.key ? 'cur' : ''}" title="${esc(x.hint)}">${esc(x.key === 'claimed' && (!t || t.rep !== me.name || cur !== 'claimed') ? 'Claim' : x.label)}</button>`).join('')}</div>
      ${t && (t.mine || me.is_admin) ? '<button class="btn ghost" id="turfUndo">Undo last area change</button>' : ''}`;
    box.querySelectorAll('[data-turf]').forEach((b) => (b.onclick = () => {
      try { K.setTurf(p.geoid, b.dataset.turf); toast(`${(TURF[b.dataset.turf] || {}).label} · tract ${p.geoid.slice(5)}`); paintTractTeam(p); render(); }
      catch (ex) { toast(ex.message); }
    }));
    const u = document.getElementById('turfUndo');
    if (u) u.onclick = async () => { try { await K.undoTurf(p.geoid); paintTractTeam(p); render(); } catch (ex) { toast(`Couldn't undo: ${ex.message}`); } };
    const houseN = K.houseNotesInTract(p.geoid).length;
    nb.innerHTML = `<h4>Area notes</h4>${noteList(K.notesFor({ tract: p.geoid }), 'No notes on this area yet.')}
      ${houseN ? `<div class="meta">${houseN} house note${houseN === 1 ? '' : 's'} in the walk list.</div>` : ''}
      ${noteBox('For the team, e.g. “HOA says no soliciting on Elm” — no names or phone numbers')}`;
    wireNotes(nb, () => ({ tract: p.geoid }), () => paintTractTeam(p));
  }
  let openedAt = 0;
  function closeSheet() { if (Date.now() - openedAt < 300) return; document.getElementById('sheet').classList.remove('open'); cardOpen = null; }

  // ---------- Walk list ----------
  const walk = { rows: [], shown: [], sort: 'walk', sortedAt: null, hideDone: false, geoid: null };
  const metres = (a, b) => {
    const k = Math.cos((a[0] * Math.PI) / 180);
    return Math.hypot((b[0] - a[0]) * 111320, (b[1] - a[1]) * 111320 * k);
  };
  const fmtDist = (m) => (m < 160 ? `${Math.round(m * 3.281 / 10) * 10} ft` : `${(m / 1609.34).toFixed(m < 16093 ? 1 : 0)} mi`);
  const walkOpen = () => document.getElementById('panel').classList.contains('open') && currentList != null;

  const tag = (text, color) => `<span class="badge" style="border-color:${color};color:${color}">${esc(text)}</span>`;
  function tags(r) {
    let t = '';
    if (r.rental) t += tag('rental unit', '#b45309');
    if (r.biz) t += tag(r.biz, '#7c3aed');
    return t;
  }

  const knockLine = (r) => {
    const k = K.latest(r.bbl);
    if (!k || !STATUS[k.status]) return '';
    const st = STATUS[k.status];
    const extra = [k.followup && FOLLOW[k.followup], k.rep, fmtWhen(k.knocked_at), k.pending && 'waiting to sync', k.failed && 'NOT SAVED'].filter(Boolean);
    return `<span class="kn" style="color:${st.color}">● ${esc(st.label)} · ${esc(extra.join(' · '))}</span>`;
  };
  const noteSnip = (r) => {
    const ns = K.notesFor({ bbl: r.bbl });
    if (!ns.length) return '';
    const body = ns[0].body.length > 70 ? ns[0].body.slice(0, 68) + '…' : ns[0].body;
    return `<span class="snip">📝 ${ns.length > 1 ? `${ns.length} notes · ` : ''}“${esc(body)}” — ${esc(ns[0].rep || '')}</span>`;
  };
  const isDone = (r) => { const k = K.latest(r.bbl); return !!(k && STATUS[k.status] && STATUS[k.status].done); };

  function renderWalk() {
    const list = document.getElementById('panelList');
    const here = loc.last;
    walk.shown = walk.rows.filter((r) => lotPasses(r) && !(walk.hideDone && isDone(r)));
    if (walk.sort === 'near' && here) {
      walk.shown.sort((a, b) => metres(here, [a.lat, a.lon]) - metres(here, [b.lat, b.lon]));
      walk.sortedAt = here;
    }
    currentList.rows = walk.shown;
    const picks = [...[...state.homes].map(homeLabel), ...[...state.sizes].map(sizeLabel)];
    const sizeNote = picks.length ? ` · ${picks.join(' / ')}` : '';
    const sortNote = walk.sort === 'near' ? (here ? ' · nearest first' : ' · finding you…') : '';
    const knocked = K.enabled && K.signedIn() ? walk.rows.filter((r) => K.latest(r.bbl)).length : null;
    document.getElementById('walkMeta').textContent = `${walk.shown.length} of ${walk.rows.length} homes${knocked != null ? ` · ${knocked} knocked` : ''}${sizeNote}${sortNote}`;
    list.innerHTML = walk.shown.map((r, i) => `
      <div class="item" data-w="${i}">
        <div class="s" style="color:${colorFor(r.score)}">${r.score}</div>
        <div class="a">${esc(r.address)}${tags(r)}<small>${r.units} unit${r.units > 1 ? 's' : ''} · built ${r.year || '—'}${r.sqft ? ` · ${Math.round(r.sqft).toLocaleString()} sq ft` : ''} · ${esc(r.cls)} · ${esc(r.zip)}</small>${knockLine(r)}${noteSnip(r)}</div>
        <div class="d"><span data-d="${i}">${here ? fmtDist(metres(here, [r.lat, r.lon])) : ''}</span><a href="https://maps.apple.com/?daddr=${r.lat},${r.lon}&dirflg=w" target="_blank" rel="noopener">Walk</a></div>
      </div>`).join('') || `<div class="empty">${walk.rows.length ? 'No homes match the home age / house size you picked.' : 'No homes in this tract.'}</div>`;
  }

  // Called on every GPS update while a walk list is open: refresh distances, re-sort after ~25 m of walking.
  function onWalkPos() {
    if (!walkOpen()) return;
    if (walk.sort === 'near' && (!walk.sortedAt || metres(walk.sortedAt, loc.last) > 25)) { renderWalk(); return; }
    document.querySelectorAll('#panelList [data-d]').forEach((el) => {
      const r = walk.shown[Number(el.dataset.d)];
      if (r) el.textContent = fmtDist(metres(loc.last, [r.lat, r.lon]));
    });
  }

  async function openWalk(p) {
    const list = document.getElementById('panelList');
    document.getElementById('panelTitle').textContent = `Tract ${p.geoid.slice(5)} · ${p.county_name}`;
    list.innerHTML = '<div class="empty">Loading…</div>';
    document.getElementById('panel').classList.add('open');
    try {
      walk.rows = await fetch(`data/walklists/${p.geoid}.json`).then((r) => r.json());
      walk.geoid = p.geoid;
      currentList = { geoid: p.geoid, rows: walk.rows };
      document.getElementById('csvBtn').style.display = '';
      document.getElementById('walkBar').style.display = '';
      document.getElementById('hideDone').style.display = K.enabled ? '' : 'none';
      renderWalk();
      syncTract();
    } catch (e) {
      list.innerHTML = '<div class="empty">Could not load walk list.</div>';
    }
  }

  // Team-wide: who has which turf, and the pins. Redraw the map only when that changes.
  let teamSig = '';
  function syncTeam() {
    if (!canKnock()) return;
    K.loadTeam().then(() => {
      const sig = [...K.allTurf().values()].map((t) => t.tract + t.status + t.rep).join() + '|' + K.pins().map((n) => n.client_id).join();
      if (sig !== teamSig) { teamSig = sig; render(); }
    }).catch(() => { /* offline */ });
  }

  // Pull the team's latest knocks and notes for the open walk list.
  function syncTract() {
    if (!canKnock() || !walkOpen() || !walk.geoid) return;
    K.loadTract(walk.geoid).then(renderWalk).catch(() => { /* offline: keep what we have */ });
  }

  function openBest() {
    const top = data.features.filter((f) => passes(f.properties)).slice(0, 25); // already sorted by score
    currentList = null;
    walk.geoid = null;
    document.getElementById('csvBtn').style.display = 'none';
    document.getElementById('walkBar').style.display = 'none';
    document.getElementById('panelTitle').textContent = 'Best turf';
    document.getElementById('panelList').innerHTML = top.map((f, i) => {
      const p = f.properties;
      return `<div class="item" data-i="${i}">
        <div class="s" style="color:${colorFor(p.score)}">${p.score}</div>
        <div class="a">${esc(p.county_name)} · tract ${esc(p.geoid.slice(5))}
          <small>${p.homes.toLocaleString()} homes · ${money(p.median_income)} · ${pct(p.pre1980)} pre-1980 · ${esc(utLabel(p.utility))}${p.dac ? ' · DAC' : ''}</small></div>
      </div>`;
    }).join('') || '<div class="empty">Nothing matches these filters.</div>';
    document.querySelectorAll('#panelList .item[data-i]').forEach((el) => {
      el.onclick = () => {
        const f = top[Number(el.dataset.i)];
        document.getElementById('panel').classList.remove('open');
        map.fitBounds(L.geoJSON(f).getBounds(), { maxZoom: 15 });
        openSheet(f.properties);
      };
    });
    document.getElementById('panel').classList.add('open');
  }

  function downloadCSV() {
    if (!currentList) return;
    const cols = ['address', 'zip', 'units', 'rental', 'biz', 'year', 'age', 'sqft', 'size', 'cls', 'block', 'bbl', 'utility', 'score', 'lat', 'lon'];
    const q = (v) => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    if (K.enabled && K.signedIn()) cols.push('status', 'followup', 'rep', 'knocked_at');
    const val = (r, c) => { const k = K.latest(r.bbl); return ['status', 'followup', 'rep', 'knocked_at'].includes(c) ? (k ? k[c] : '') : r[c]; };
    const csv = [cols.join(','), ...currentList.rows.map((r) => cols.map((c) => q(val(r, c))).join(','))].join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = `walklist_${currentList.geoid}.csv`;
    a.click();
  }

  document.querySelectorAll('#utilSeg button').forEach((b) => (b.onclick = () => {
    document.querySelectorAll('#utilSeg button').forEach((x) => x.classList.toggle('on', x === b));
    state.util = b.dataset.u; render();
  }));
  document.getElementById('dacBtn').onclick = (e) => { state.dac = !state.dac; e.target.classList.toggle('on', state.dac); render(); };
  // ---------- Target sheet ----------
  const groups = [
    ['tgIncome', 'incomes', TG.income_bands.map((b) => ({ key: b, label: b }))],
    ['tgHome', 'homes', TG.home_age_bands],
    ['tgAge', 'ages', TG.owner_age_bands],
    ['tgSize', 'sizes', TG.size_bands],
  ];
  const countMatches = () => data.features.filter((f) => passes(f.properties)).length;
  function paintTarget() {
    for (const [id, k] of groups) document.querySelectorAll(`#${id} .chip`).forEach((b) => b.classList.toggle('on', state[k].has(b.dataset.k)));
    const n = state.incomes.size + state.homes.size + state.ages.size + state.sizes.size;
    const tb = document.getElementById('targetBtn');
    tb.textContent = n ? `Target · ${n}` : 'Target';
    tb.classList.toggle('on', n > 0);
    const n2 = countMatches();
    document.getElementById('targetDone').textContent = `Show ${n2} tract${n2 === 1 ? '' : 's'}`;
  }
  for (const [id, k, opts] of groups) {
    const el = document.getElementById(id);
    el.innerHTML = opts.map((o) => `<button class="chip" data-k="${esc(o.key)}">${esc(o.label)}</button>`).join('');
    el.querySelectorAll('.chip').forEach((b) => (b.onclick = () => {
      state[k].has(b.dataset.k) ? state[k].delete(b.dataset.k) : state[k].add(b.dataset.k);
      paintTarget(); render();
      if (walkOpen()) renderWalk();
    }));
  }
  document.getElementById('targetBtn').onclick = () => { paintTarget(); document.getElementById('sheet').classList.remove('open'); document.getElementById('targetSheet').classList.add('open'); };
  document.getElementById('targetDone').onclick = () => document.getElementById('targetSheet').classList.remove('open');
  document.getElementById('targetClear').onclick = () => { state.incomes.clear(); state.homes.clear(); state.ages.clear(); state.sizes.clear(); paintTarget(); render(); };
  map.on('click', () => document.getElementById('targetSheet').classList.remove('open'));

  document.querySelectorAll('#walkSort button').forEach((b) => (b.onclick = () => {
    document.querySelectorAll('#walkSort button').forEach((x) => x.classList.toggle('on', x === b));
    walk.sort = b.dataset.s; walk.sortedAt = null;
    if (walk.sort === 'near' && loc.watchId == null) startTracking(); // need a GPS fix to sort by distance
    renderWalk();
  }));
  document.getElementById('minScore').oninput = (e) => { state.min = Number(e.target.value); document.getElementById('minVal').textContent = state.min; render(); };
  document.getElementById('bestBtn').onclick = openBest;
  document.getElementById('panelBack').onclick = () => document.getElementById('panel').classList.remove('open');
  document.getElementById('csvBtn').onclick = downloadCSV;
  map.on('click', closeSheet);

  // ---------- Pins: notes dropped on the map ----------
  function tractAtPoint(lat, lon) { const f = typeof tractAt === 'function' ? tractAt(lon, lat) : null; return f ? f.properties.geoid : null; }
  function openPinEditor(lat, lon) {
    const body = document.getElementById('noteBody');
    const g = tractAtPoint(lat, lon);
    body.innerHTML = `<div class="title">New pin</div>
      <div class="meta">${g ? `Tract ${esc(g.slice(5))}` : 'Outside the scored tracts'} · the whole team will see it</div>
      <div id="pinNew">${noteBox('e.g. “No soliciting sign”, “Gated block — skip” — no names or phone numbers')}</div>
      <button class="btn ghost" id="pinCancel">Cancel</button>`;
    wireNotes(document.getElementById('pinNew'), () => ({ tract: g, lat, lon }), () => { closeAll(); drawOverlay(); });
    document.getElementById('pinCancel').onclick = closeAll;
    document.getElementById('noteSheet').classList.add('open');
    setTimeout(() => { const ta = body.querySelector('textarea'); if (ta) ta.focus(); }, 250);
  }
  function openPin(n) {
    const body = document.getElementById('noteBody');
    const me = K.me();
    body.innerHTML = `<div class="title">📍 Pin</div>
      <div class="note-item" style="font-size:16px">${esc(n.body)}<span class="who">${noteWho(n)}</span></div>
      <a class="btn ghost" style="text-align:center;text-decoration:none" href="https://maps.apple.com/?daddr=${n.lat},${n.lon}&dirflg=w" target="_blank" rel="noopener">Walk here</a>
      ${n.mine || (me && me.is_admin) ? '<button class="btn ghost" id="pinDel">Delete pin</button>' : ''}
      <button class="btn ghost" id="pinClose">Close</button>`;
    const del = document.getElementById('pinDel');
    if (del) del.onclick = async () => { try { await K.deleteNote(n.client_id); closeAll(); drawOverlay(); toast('Pin deleted'); } catch (ex) { toast(`Couldn't delete: ${ex.message}`); } };
    document.getElementById('pinClose').onclick = closeAll;
    document.getElementById('noteSheet').classList.add('open');
  }
  function startPin() {
    if (!canKnock()) { openAcct(); return; }
    const body = document.getElementById('noteBody');
    body.innerHTML = `<div class="title">Drop a pin</div>
      <div class="meta">A note on the map the whole team can see.</div>
      ${loc.last ? '<button class="btn" id="pinHere">At my location</button>' : ''}
      <button class="btn ${loc.last ? 'ghost' : ''}" id="pinTap">Tap a spot on the map</button>
      <button class="btn ghost" id="pinCancel">Cancel</button>`;
    const here = document.getElementById('pinHere');
    if (here) here.onclick = () => openPinEditor(loc.last[0], loc.last[1]);
    document.getElementById('pinTap').onclick = () => { closeAll(); placingPin = true; toast('Tap the map where the pin goes'); };
    document.getElementById('pinCancel').onclick = closeAll;
    document.getElementById('noteSheet').classList.add('open');
  }
  map.on('click', (e) => {
    if (!placingPin) return;
    placingPin = false;
    openPinEditor(e.latlng.lat, e.latlng.lng);
  });

  // ---------- Account ----------
  const acctBtn = document.getElementById('acctBtn');
  function paintAcct() {
    const on = K.enabled && K.signedIn() && !!K.me();
    document.getElementById('mineBtn').style.display = on ? '' : 'none';
    const pinBtn = document.getElementById('pinBtn');          // created with the map controls further down
    if (pinBtn) pinBtn.style.display = on ? '' : 'none';
    document.getElementById('legendReps').innerHTML = on ? Object.entries(REPCOLOR).map(([n, c]) => `<span><i style="border-color:${c}"></i>${esc(n)}</span>`).join('') : '';
    if (!K.enabled) { acctBtn.style.display = 'none'; return; }
    acctBtn.style.display = '';
    const n = K.pendingCount();
    const me = K.me();
    acctBtn.textContent = !K.signedIn() ? 'Sign in' : me ? `${me.name}${n ? ` · ${n} to sync` : ''}` : 'Not on team';
    acctBtn.classList.toggle('warn', K.signedIn() && (!me || n > 0));
  }
  const closeAll = () => ['acctSheet', 'knockSheet', 'noteSheet'].forEach((id) => document.getElementById(id).classList.remove('open'));
  function openAcct() {
    const body = document.getElementById('acctBody');
    const me = K.me();
    const tip = standalone() ? '' : '<div class="meta" style="margin-top:10px">Tip: in Safari tap Share → <b>Add to Home Screen</b> to use TurfScope full screen like an app.</div>';
    if (!K.signedIn()) {
      body.innerHTML = `
        <div class="title">Sign in</div>
        <div class="meta">Use the email and password Gio set up for you.</div>
        <form id="loginForm" autocomplete="on">
          <label class="field">Email<input id="loginEmail" type="email" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required></label>
          <label class="field">Password<input id="loginPw" type="password" autocomplete="current-password" required></label>
          <div class="err" id="loginErr"></div>
          <button class="btn" type="submit" id="loginBtn">Sign in</button>
        </form>
        <button class="btn ghost" id="acctClose">Close</button>${tip}`;
      document.getElementById('loginForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('loginBtn'); const err = document.getElementById('loginErr');
        btn.disabled = true; btn.textContent = 'Signing in…'; err.textContent = '';
        try {
          const me = await K.signIn(document.getElementById('loginEmail').value, document.getElementById('loginPw').value);
          if (!me) { openAcct(); return; }
          closeAll(); toast(`Signed in as ${me.name}`); syncTract(); syncTeam();
        } catch (ex) {
          err.textContent = !ex.status ? 'No signal. Try again when you have service.' : /invalid/i.test(ex.message) ? 'Wrong email or password.' : ex.message;
          btn.disabled = false; btn.textContent = 'Sign in';
        }
      };
    } else if (!me) {
      body.innerHTML = `
        <div class="title">Not on the team list</div>
        <p>You're signed in as <b>${esc(K.email())}</b>, but that email isn't linked to a rep yet. Ask Gio to add it in Supabase (see supabase/README.md, step 4).</p>
        <button class="btn" id="acctRetry">Check again</button>
        <button class="btn ghost" id="acctOut">Sign out</button>`;
      document.getElementById('acctRetry').onclick = async () => { try { await K.loadMe(); } catch (e) { /* offline */ } openAcct(); };
    } else {
      const n = K.pendingCount();
      body.innerHTML = `
        <div class="row"><div class="title">${esc(me.name)}${me.is_admin ? ' <span class="badge">admin</span>' : ''}</div></div>
        <div class="meta">${esc(K.email())}</div>
        <div class="warn" style="margin-top:10px">${n ? `<b>${n} knock${n === 1 ? '' : 's'} waiting to sync.</b> They're saved on this phone and go up as soon as you have signal.` : 'All knocks synced.'}</div>
        ${n ? '<button class="btn" id="acctSync">Sync now</button>' : ''}
        <div class="section"><h4>My turf</h4><div id="myTurf" class="mine-list"></div></div>
        <div class="section"><h4>My come-backs &amp; interested</h4><div id="myFollow" class="mine-list meta">Loading…</div></div>
        <div class="section"><h4>Team today</h4><div id="scoreBox" class="meta">Loading…</div></div>
        <button class="btn ghost" id="acctOut">Sign out</button>
        <button class="btn ghost" id="acctClose">Close</button>${tip}`;
      if (n) document.getElementById('acctSync').onclick = async () => { await K.flush(); openAcct(); };
      const featBy = (g) => data.features.find((f) => f.properties.geoid === g);
      const goTract = (g) => { const f = featBy(g); if (!f) return; closeAll(); map.fitBounds(L.geoJSON(f).getBounds(), { maxZoom: 15 }); openSheet(f.properties); };
      const mineTurf = [...K.allTurf().values()].filter((t) => t.rep === me.name && t.status !== 'open');
      document.getElementById('myTurf').innerHTML = mineTurf.length ? mineTurf.map((t) => {
        const f = featBy(t.tract); const pp = f ? f.properties : null;
        return `<div class="item" data-go="${esc(t.tract)}"><div class="a">${pp ? `${esc(pp.county_name)} · tract ${esc(t.tract.slice(5))}` : esc(t.tract)}<small>${esc((TURF[t.status] || {}).label || t.status)} · ${esc(fmtWhen(t.set_at))}${pp ? ` · ${pp.homes.toLocaleString()} homes` : ''}</small></div></div>`;
      }).join('') : '<div class="meta">Nothing claimed yet. Open a tract and tap Claim.</div>';
      K.myFollowups().then((rows) => {
        const el = document.getElementById('myFollow'); if (!el) return;
        el.classList.remove('meta');
        el.innerHTML = rows.length ? rows.map((k) => `<div class="item" data-go="${esc(k.tract)}"><div class="a">${esc(k.address || k.bbl)}<small style="color:${(STATUS[k.status] || {}).color}">${esc((STATUS[k.status] || {}).label || k.status)}${k.followup ? ` · ${esc(FOLLOW[k.followup] || '')}` : ''} · ${esc(fmtWhen(k.knocked_at))}</small></div></div>`).join('')
          : '<div class="meta">None right now.</div>';
        el.querySelectorAll('[data-go]').forEach((x) => (x.onclick = () => goTract(x.dataset.go)));
      }).catch(() => { const el = document.getElementById('myFollow'); if (el) el.textContent = 'Offline — shows when you have signal.'; });
      document.querySelectorAll('#myTurf [data-go]').forEach((x) => (x.onclick = () => goTract(x.dataset.go)));
      K.repStats().then((rows) => {
        const box = document.getElementById('scoreBox'); if (!box) return;
        box.outerHTML = `<table class="score-table"><tr><th>Rep</th><th class="n">Knocks</th><th class="n">Booked</th><th class="n">Turf</th><th class="n">All-time booked</th></tr>
          ${rows.map((r) => `<tr><td>${esc(r.rep)}</td><td class="n">${r.knocks_today}</td><td class="n">${r.booked_today}</td><td class="n">${r.turf_claimed ?? 0}</td><td class="n">${r.booked}</td></tr>`).join('')}</table>`;
      }).catch(() => { const box = document.getElementById('scoreBox'); if (box) box.textContent = 'Offline — scoreboard shows when you have signal.'; });
    }
    const out = document.getElementById('acctOut');
    if (out) out.onclick = async () => { try { await K.signOut(); closeAll(); state.mine = false; render(); renderIfWalk(); } catch (ex) { toast(ex.message); } };
    const close = document.getElementById('acctClose');
    if (close) close.onclick = closeAll;
    document.getElementById('sheet').classList.remove('open');
    document.getElementById('targetSheet').classList.remove('open');
    document.getElementById('acctSheet').classList.add('open');
  }
  acctBtn.onclick = openAcct;
  document.getElementById('mineBtn').onclick = (e) => {
    state.mine = !state.mine; e.target.classList.toggle('on', state.mine); render();
    if (state.mine && layer.getLayers().length) map.fitBounds(layer.getBounds(), { maxZoom: 15 });
    else if (state.mine) toast('You have no claimed turf yet. Open a tract and tap Claim.');
  };

  // ---------- Knock a door ----------
  let toastTimer = null, toastUndo = null;
  function toast(text, undoFn) {
    const t = document.getElementById('toast');
    document.getElementById('toastText').textContent = text;
    document.getElementById('toastUndo').style.display = undoFn ? '' : 'none';
    toastUndo = undoFn || null;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), undoFn ? 6000 : 2500);
  }
  document.getElementById('toastUndo').onclick = async () => {
    const fn = toastUndo; document.getElementById('toast').classList.remove('show');
    if (fn) { try { await fn(); } catch (ex) { toast(`Couldn't undo: ${ex.message}`); } }
  };

  function openKnock(r) {
    const body = document.getElementById('knockBody');
    const k = K.latest(r.bbl);
    const me = K.me();
    const head = `<div class="title">${esc(r.address)}</div>
      <div class="meta">${r.units} unit${r.units > 1 ? 's' : ''} · built ${r.year || '—'} · ${esc(r.zip)}</div>
      ${k && STATUS[k.status] ? `<div class="kn" style="color:${STATUS[k.status].color};margin-top:6px">Last: ${esc(STATUS[k.status].label)}${k.followup ? ` (${esc(FOLLOW[k.followup] || '')})` : ''} · ${esc(k.rep || '')} · ${esc(fmtWhen(k.knocked_at))}</div>` : ''}`;
    if (!canKnock()) {
      body.innerHTML = `${head}<p class="meta">Sign in to record knocks.</p><button class="btn" id="kSignIn">Sign in</button><button class="btn ghost" id="kClose">Close</button>`;
      document.getElementById('kSignIn').onclick = openAcct;
    } else {
      const canUndo = k && (k.rep === me.name || me.is_admin);
      body.innerHTML = `${head}
        <div class="kgrid">${STATUSES.map((st, i) => `<button data-st="${esc(st.key)}" class="${i === STATUSES.length - 1 && STATUSES.length % 2 ? 'wide' : ''}${k && k.status === st.key ? ' cur' : ''}" style="background:${st.color}">${esc(st.label)}</button>`).join('')}</div>
        <div id="fBox" style="display:none">
          <div class="meta">When should we come back? (optional)</div>
          <div class="fchips">${Object.entries(FOLLOW).map(([key, label]) => `<button class="chip" data-f="${esc(key)}">${esc(label)}</button>`).join('')}</div>
          <button class="btn" id="fSave">Save come back</button>
        </div>
        ${canUndo ? '<button class="btn ghost" id="kUndo">Undo last knock</button>' : ''}
        <div class="section" id="houseNotes"><h4>House notes</h4>${noteList(K.notesFor({ bbl: r.bbl }), 'No notes on this house yet.')}${noteBox('For the team, e.g. “Big dog — use side gate” — no names or phone numbers')}</div>
        <button class="btn ghost" id="kClose">Close</button>`;
      let follow = null;
      const save = (status, followup) => {
        try {
          K.record(r.bbl, walk.geoid, status, followup, r.address);
          closeAll();
          toast(`${STATUS[status].label} · ${r.address}`, () => K.undo(r.bbl));
        } catch (ex) { toast(ex.message); }
      };
      body.querySelectorAll('[data-st]').forEach((b) => (b.onclick = () => {
        if (b.dataset.st === 'come_back' && Object.keys(FOLLOW).length) {
          document.getElementById('fBox').style.display = '';
          body.querySelectorAll('[data-st]').forEach((x) => x.classList.toggle('cur', x === b));
          return;
        }
        save(b.dataset.st, null);
      }));
      body.querySelectorAll('[data-f]').forEach((b) => (b.onclick = () => {
        follow = follow === b.dataset.f ? null : b.dataset.f;
        body.querySelectorAll('[data-f]').forEach((x) => x.classList.toggle('on', x.dataset.f === follow));
      }));
      document.getElementById('fSave').onclick = () => save('come_back', follow);
      wireNotes(document.getElementById('houseNotes'), () => ({ tract: walk.geoid, bbl: r.bbl, address: r.address }), () => openKnock(r));
      if (canUndo) document.getElementById('kUndo').onclick = async () => {
        try { await K.undo(r.bbl); closeAll(); toast('Knock removed'); } catch (ex) { toast(`Couldn't undo: ${ex.message}`); }
      };
    }
    document.getElementById('kClose').onclick = closeAll;
    document.getElementById('knockSheet').classList.add('open');
  }

  document.getElementById('panelList').addEventListener('click', (e) => {
    if (e.target.closest('a')) return;                       // the Walk link opens Apple Maps
    const item = e.target.closest('.item[data-w]');
    if (!item || currentList == null || !K.enabled) return;  // knock tracking not set up yet
    const r = walk.shown[Number(item.dataset.w)];
    if (r) openKnock(r);
  });
  document.getElementById('hideDone').onclick = (e) => {
    walk.hideDone = !walk.hideDone;
    e.target.classList.toggle('on', walk.hideDone);
    renderWalk();
  };

  // Keep the screen fresh: redraw on changes, sync when signal returns, pull teammates' knocks.
  let redrawQueued = false;
  const renderIfWalk = () => { if (walkOpen()) renderWalk(); };
  K.onChange(() => {
    paintAcct();
    if (cardOpen && document.getElementById('sheet').classList.contains('open')) {
      const ta = document.querySelector('#areaNotes textarea.note');
      if (!ta || (!ta.value && document.activeElement !== ta)) paintTractTeam(cardOpen);
    }
    const sig = [...K.allTurf().values()].map((t) => t.tract + t.status + t.rep).join() + '|' + K.pins().map((n) => n.client_id).join();
    if (sig !== teamSig) { teamSig = sig; render(); }
    if (redrawQueued) return;
    redrawQueued = true;
    requestAnimationFrame(() => { redrawQueued = false; renderIfWalk(); });
  });
  window.addEventListener('online', () => { K.flush && K.flush(); syncTract(); syncTeam(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { if (K.flush) K.flush(); syncTract(); syncTeam(); }
  });
  setInterval(() => {
    if (document.visibilityState !== 'visible') return;
    if (K.pendingCount() && K.flush) K.flush();
    syncTract();
    syncTeam();
  }, ((appCfg && appCfg.refresh_seconds) || 60) * 1000);
  paintAcct();
  if (K.enabled && K.signedIn()) { K.loadMe().then(() => { paintAcct(); syncTeam(); }).catch(() => {}); if (K.flush) K.flush(); syncTeam(); }

  // ---------- Live location ----------
  // Uses the phone's GPS through the browser. The position never leaves the phone:
  // it's only used to draw the blue dot and look up which tract you're standing in.
  const boxes = data.features.map((f) => {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const walk = (a) => { if (typeof a[0] === 'number') { x0 = Math.min(x0, a[0]); x1 = Math.max(x1, a[0]); y0 = Math.min(y0, a[1]); y1 = Math.max(y1, a[1]); } else a.forEach(walk); };
    walk(f.geometry.coordinates);
    return [x0, y0, x1, y1];
  });
  const inRing = ([x, y], ring) => {
    let inside = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const [xi, yi] = ring[i], [xj, yj] = ring[j];
      if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  };
  const inPoly = (pt, rings) => inRing(pt, rings[0]) && !rings.slice(1).some((r) => inRing(pt, r));
  const inGeom = (pt, g) => (g.type === 'Polygon' ? inPoly(pt, g.coordinates) : g.coordinates.some((p) => inPoly(pt, p)));
  function tractAt(lon, lat) {
    for (let i = 0; i < data.features.length; i++) {
      const b = boxes[i];
      if (lon < b[0] || lon > b[2] || lat < b[1] || lat > b[3]) continue;
      if (inGeom([lon, lat], data.features[i].geometry)) return data.features[i];
    }
    return null;
  }

  const loc = { watchId: null, follow: false, dot: null, ring: null, first: true, tract: null, last: null };
  const LocateCtl = L.Control.extend({ onAdd() {
    const b = L.DomUtil.create('button', 'locate');
    b.id = 'locateBtn'; b.type = 'button'; b.title = 'Show my location'; b.setAttribute('aria-label', 'Show my location');
    b.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>';
    L.DomEvent.disableClickPropagation(b);
    return b;
  } });
  const HereCtl = L.Control.extend({ onAdd() {
    const d = L.DomUtil.create('div', 'here'); d.id = 'here';
    L.DomEvent.disableClickPropagation(d);
    return d;
  } });
  new LocateCtl({ position: 'topright' }).addTo(map);
  new HereCtl({ position: 'topleft' }).addTo(map);
  const PinCtl = L.Control.extend({ onAdd() {
    const b = L.DomUtil.create('button', 'locate');
    b.id = 'pinBtn'; b.type = 'button'; b.title = 'Drop a pin'; b.setAttribute('aria-label', 'Drop a pin with a note');
    b.style.marginTop = '8px'; b.style.display = 'none';
    b.onclick = () => startPin();
    b.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-7.2 7-12.5A7 7 0 0 0 5 9.5C5 14.8 12 22 12 22z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
    L.DomEvent.disableClickPropagation(b);
    return b;
  } });
  new PinCtl({ position: 'topright' }).addTo(map);
  paintAcct();
  const btn = document.getElementById('locateBtn');
  const here = document.getElementById('here');

  function paintBtn() {
    btn.classList.toggle('on', loc.watchId != null && loc.follow);
    btn.classList.toggle('track', loc.watchId != null && !loc.follow);
  }
  function showHere(html) { here.innerHTML = html; here.classList.toggle('show', !!html); }

  function onPos(pos) {
    const { latitude: lat, longitude: lon, accuracy } = pos.coords;
    const ll = [lat, lon];
    loc.last = ll;
    if (!loc.dot) {
      loc.ring = L.circle(ll, { radius: accuracy, color: '#2563eb', weight: 1, fillOpacity: 0.1, interactive: false }).addTo(map);
      loc.dot = L.circleMarker(ll, { radius: 8, color: '#fff', weight: 3, fillColor: '#2563eb', fillOpacity: 1, interactive: false }).addTo(map);
    } else { loc.dot.setLatLng(ll); loc.ring.setLatLng(ll).setRadius(accuracy); }
    if (loc.follow) {
      if (loc.first) map.setView(ll, Math.max(map.getZoom(), 16)); else map.panTo(ll, { animate: true });
    }
    loc.first = false;
    onWalkPos();
    const f = tractAt(lon, lat);
    loc.tract = f;
    if (f) {
      const p = f.properties;
      showHere(`<b style="color:${colorFor(p.score)}">${p.score}</b>${esc(p.county_name)} · tract ${esc(p.geoid.slice(5))}<div class="meta">${esc(utLabel(p.utility))}${p.dac ? ' · DAC' : ''} · tap for details</div>`);
    } else {
      showHere(`<div class="meta">You're outside the scored tracts${accuracy > 100 ? ` · GPS ±${Math.round(accuracy)} m` : ''}</div>`);
    }
  }
  function onErr(err) {
    const msg = err.code === 1 ? 'Location is blocked. Allow it for this site in your browser settings.'
      : err.code === 3 ? 'Still looking for GPS…' : 'Could not get your location.';
    showHere(`<div class="meta">${msg}</div>`);
    if (err.code === 1) stopTracking(false);
  }
  let wake = null;
  async function keepAwake(on) {
    try {
      if (on && 'wakeLock' in navigator && document.visibilityState === 'visible') wake = await navigator.wakeLock.request('screen');
      else if (!on && wake) { await wake.release(); wake = null; }
    } catch (e) { wake = null; }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && loc.watchId != null) keepAwake(true); });

  function startTracking() {
    if (!('geolocation' in navigator)) { showHere('<div class="meta">This browser can\'t share location.</div>'); return; }
    loc.follow = true; loc.first = true;
    showHere('<div class="meta">Finding you…</div>');
    loc.watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
    keepAwake(true);
    paintBtn();
  }
  function stopTracking(clear = true) {
    if (loc.watchId != null) navigator.geolocation.clearWatch(loc.watchId);
    loc.watchId = null; loc.follow = false; loc.tract = null; loc.last = null;
    keepAwake(false);
    if (loc.dot) { loc.dot.remove(); loc.ring.remove(); loc.dot = loc.ring = null; }
    if (clear) showHere('');
    paintBtn();
  }
  // Tap: off → follow me. Following → stop. Tracking but you panned away → follow again.
  btn.onclick = () => {
    if (loc.watchId == null) startTracking();
    else if (loc.follow) stopTracking();
    else { loc.follow = true; if (loc.dot) map.panTo(loc.dot.getLatLng()); paintBtn(); }
  };
  map.on('dragstart', () => { if (loc.follow) { loc.follow = false; paintBtn(); } });
  here.onclick = () => { if (loc.tract) openSheet(loc.tract.properties); };

  render();
  if (layer.getLayers().length) map.fitBounds(layer.getBounds(), { animate: false });
})();
</script>
</body>
</html>
